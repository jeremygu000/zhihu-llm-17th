services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      sh -c 'exec redis-server
      --appendonly yes
      --save 60 1
      --protected-mode no'
    volumes:
      - redis_data:/data
    networks:
      - app_net

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      - redis
    networks:
      - app_net

  # ---------- Milvus 依赖：ETCD ----------
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    restart: unless-stopped
    command: >
      etcd
        --name etcd
        --data-dir /etcd
        --advertise-client-urls http://0.0.0.0:2379
        --listen-client-urls http://0.0.0.0:2379
        --initial-advertise-peer-urls http://0.0.0.0:2380
        --listen-peer-urls http://0.0.0.0:2380
        --initial-cluster etcd=http://0.0.0.0:2380
        --initial-cluster-state new
        --initial-cluster-token etcd-cluster-1
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus_etcd:/etcd
    healthcheck:
      test: ["CMD", "sh", "-c", "ETCDCTL_API=3 etcdctl --endpoints=http://localhost:2379 endpoint health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  # ---------- Milvus 依赖：MinIO（对象存储） ----------
  milvus-minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - milvus_minio:/data
    ports:
      - "9000:9000"   # MinIO API
      - "9001:9001"   # MinIO Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  # ---------- Milvus Standalone ----------
  milvus-standalone:
    image: milvusdb/milvus:v2.6.4
    container_name: milvus-standalone
    restart: unless-stopped
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    # 显式指定要运行的程序（避免 tini 无子进程）
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530" # gRPC
      - "9092:9092"   # HTTP
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "bash", "-lc", "nc -z localhost 19530 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  # ---------- Milvus 管理 UI：Attu ----------
  attu:
    image: zilliz/attu:latest
    container_name: attu
    restart: unless-stopped
    ports:
      - "18000:3000"     # 如冲突可改 "18000:3000"
    depends_on:
      - milvus-standalone
    networks:
      - app_net

volumes:
  redis_data:
  redisinsight_data:
  milvus_etcd:
  milvus_minio:
  milvus_data:

networks:
  app_net:
    driver: bridge
